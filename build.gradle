plugins {
    id 'java'
    id 'application'
}

group = 'com.passgen'
version = '2.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // FlatLaf — modern flat look-and-feel for Swing
    implementation 'com.formdev:flatlaf:3.5.4'
    implementation 'com.formdev:flatlaf-intellij-themes:3.5.4'
}

application {
    mainClass = 'com.passgen.Main'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.passgen.Main'
    }
    // Create a fat-jar with all dependencies included
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// Ensure source files are compiled from the new package structure
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
    }
}
